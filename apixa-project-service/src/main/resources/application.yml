server:
  port: 8081

spring:
  application:
    name: apixa-project-service
  datasource:
    url: jdbc:sqlite:./data/project.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
  threads:
    virtual:
      enabled: true

apixa:
  service-name: apixa-project-service
