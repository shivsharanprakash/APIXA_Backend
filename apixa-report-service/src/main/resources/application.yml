server:
  port: 8090

spring:
  application:
    name: apixa-report-service
  datasource:
    url: jdbc:sqlite:./data/report.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
  threads:
    virtual:
      enabled: true

apixa:
  service-name: apixa-report-service
  report:
    # Generated report artifacts are optional. In-memory retrieval always works;
    # set write-files=true to also keep report-<reportId>.json|html|pdf in output-dir.
    write-files: false
    output-dir: ./data/reports
